name: Fast PR & CI Gate (.NET Backend)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ci-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # =========================================================================
  # Tier 1: Fast PR Sanity Gate (< 90 seconds)
  # Runs on every push to every PR. Verifies code formatting, restores,
  # compiles with TreatWarningsAsErrors, and runs architecture & unit tests.
  # =========================================================================
  tier1-fast-gate:
    name: "Tier 1: PR Sanity & Architecture (<90s)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'Platform.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore Platform.slnx

      - name: Code Formatting & Linting Check
        run: dotnet format Platform.slnx --verify-no-changes --verbosity minimal

      - name: Fast Compilation Check (TreatWarningsAsErrors)
        run: dotnet build Platform.slnx --no-restore -c Release

      - name: Enforce Architecture & Module Boundary Rules
        run: dotnet test --project tests/Platform.ArchitectureTests/Platform.ArchitectureTests.csproj --no-build -c Release

      - name: Run In-Memory Unit Tests
        run: dotnet test --project tests/Platform.UnitTests/Platform.UnitTests.csproj --no-build -c Release

  # =========================================================================
  # Tier 2: Integration & Migration Parity Gate (2-4 minutes)
  # Runs only when PR is non-draft or on main push.
  # Spins up Postgres 17 & Redis 7 to execute database & integration tests.
  # =========================================================================
  tier2-integration-gate:
    name: "Tier 2: Integration & Migrations"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [tier1-fast-gate]
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'Platform.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore & Build
        run: |
          dotnet restore Platform.slnx
          dotnet build Platform.slnx --no-restore -c Release

      - name: Verify EF Core Migration Model Parity
        run: |
          dotnet tool restore
          for m in Identity Tenancy People Groups Events Giving Content Communications; do
            echo "Checking EF Core model parity for $m..."
            dotnet ef migrations has-pending-model-changes -p src/Modules/$m/Platform.Modules.$m -s src/Host/Platform.Api --no-build --configuration Release
          done

      - name: Run Database & Real-Time Integration Tests
        env:
          TEST_DB_CONNECTION: Host=localhost;Port=5432;Username=postgres;Password=postgres
          ConnectionStrings__Redis: localhost:6379
        run: dotnet test --project tests/Platform.IntegrationTests/Platform.IntegrationTests.csproj --no-build -c Release

  # =========================================================================
  # Tier 3: Security & Vulnerability Scan
  # Checks dependencies for known CVEs and scans Dockerfile.
  # =========================================================================
  tier3-security-gate:
    name: "Tier 3: Security & Vulnerability Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 6
    needs: [tier1-fast-gate]
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Audit NuGet Package Vulnerabilities
        run: dotnet list package --vulnerable --include-transitive
