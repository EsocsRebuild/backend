# ==============================================================================
# Local Development Stack
# Usage:
#   docker compose up -d db redis mailpit   # Infra only; run API from IDE/dotnet run
#   docker compose up --build               # Complete stack with hot-reloading API
# ==============================================================================
services:
  db:
    image: postgres:17-alpine
    container_name: platform-dev-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platform_dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: platform-dev-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: platform-dev-mailpit
    ports:
      - "8025:8025"   # Web UI: http://localhost:8025
      - "1025:1025"   # SMTP Port
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: platform-dev-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["5080:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=db;Port=5432;Database=platform_dev;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379
      Auth__SigningKey: dev-only-signing-key-change-me-0123456789abcdef
      Auth__Issuer: "http://localhost:5080"
      Auth__AppBaseUrl: "http://localhost:3001"
      Auth__TotpIssuer: "ESOCS Admin (dev)"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "http://localhost:3001"
      Email__Provider: Smtp
      Email__SmtpHost: mailpit
      Email__SmtpPort: "1025"
      Email__UseStartTls: "false"
      Database__MigrateOnStartup: "true"
      Seed__Enabled: "true"
      Seed__TenantSlug: "esocs"
      Seed__TenantName: "Eternal Sacred Order of Cherubim & Seraphim"
      Seed__OwnerEmail: "admin@esocs.test"
      Seed__OwnerPassword: "Preview-Password-2026"
      Tenancy__DefaultTenant: "esocs"
      RateLimits__AuthPerMinute: "500"
      RateLimits__PublicPerMinute: "2000"
      RateLimits__UserPerMinute: "5000"
      # Hot Reload configuration for Docker on macOS/Linux
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      DOTNET_WATCH_POLLING_INTERVAL: "500"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "true"
      DOTNET_WATCH_SUPPRESS_EMITTING_PAGE: "true"
    volumes:
      - .:/workspace
      # Mask all project bin/obj folders so host Mac builds and container Linux builds do not collide
      - /workspace/src/Host/Platform.Api/bin
      - /workspace/src/Host/Platform.Api/obj
      - /workspace/src/BuildingBlocks/Platform.SharedKernel/bin
      - /workspace/src/BuildingBlocks/Platform.SharedKernel/obj
      - /workspace/src/BuildingBlocks/Platform.Application/bin
      - /workspace/src/BuildingBlocks/Platform.Application/obj
      - /workspace/src/BuildingBlocks/Platform.Infrastructure/bin
      - /workspace/src/BuildingBlocks/Platform.Infrastructure/obj
      - /workspace/src/BuildingBlocks/Platform.Web/bin
      - /workspace/src/BuildingBlocks/Platform.Web/obj
      - /workspace/src/Modules/Identity/Platform.Modules.Identity/bin
      - /workspace/src/Modules/Identity/Platform.Modules.Identity/obj
      - /workspace/src/Modules/Tenancy/Platform.Modules.Tenancy/bin
      - /workspace/src/Modules/Tenancy/Platform.Modules.Tenancy/obj
      - /workspace/src/Modules/People/Platform.Modules.People/bin
      - /workspace/src/Modules/People/Platform.Modules.People/obj
      - /workspace/src/Modules/Groups/Platform.Modules.Groups/bin
      - /workspace/src/Modules/Groups/Platform.Modules.Groups/obj
      - /workspace/src/Modules/Events/Platform.Modules.Events/bin
      - /workspace/src/Modules/Events/Platform.Modules.Events/obj
      - /workspace/src/Modules/Giving/Platform.Modules.Giving/bin
      - /workspace/src/Modules/Giving/Platform.Modules.Giving/obj
      - /workspace/src/Modules/Content/Platform.Modules.Content/bin
      - /workspace/src/Modules/Content/Platform.Modules.Content/obj
      - /workspace/src/Modules/Communications/Platform.Modules.Communications/bin
      - /workspace/src/Modules/Communications/Platform.Modules.Communications/obj
      - storage:/workspace/storage
    restart: unless-stopped

volumes:
  pgdata:
  storage:
