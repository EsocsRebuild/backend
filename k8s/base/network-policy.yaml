apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-network-policy
  namespace: platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: esocs-digital-platform
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic to the API on port 8080
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS queries
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow PostgreSQL connection
    - ports:
        - protocol: TCP
          port: 5432
    # Allow Redis connection
    - ports:
        - protocol: TCP
          port: 6379
    # Allow outbound HTTPS to external email/SMS providers (Resend, SendGrid, Postmark, Termii, Firebase)
    - ports:
        - protocol: TCP
          port: 443

