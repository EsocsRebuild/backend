apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-worker
  namespace: platform
  labels:
    app.kubernetes.io/name: platform-worker
    app.kubernetes.io/component: background-worker
    app.kubernetes.io/part-of: esocs-digital-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-worker
        app.kubernetes.io/component: background-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        fsGroup: 1654
      containers:
        - name: worker
          image: ghcr.io/techdev/platform-api:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          env:
            - name: WORKER_ROLE
              value: "BackgroundDispatcher"
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: storage
              mountPath: /app/storage
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: platform-storage-pvc
        - name: tmp
          emptyDir: {}

