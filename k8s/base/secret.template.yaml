apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: platform
type: Opaque
stringData:
  # Connection Strings (Managed Cloud PostgreSQL & Redis)
  ConnectionStrings__Database: "Host=postgres.platform.svc.cluster.local;Port=5432;Database=platform_prod;Username=platform_app;Password=REPLACE_WITH_SECURE_PASSWORD"
  ConnectionStrings__Redis: "redis.platform.svc.cluster.local:6379,password=REPLACE_WITH_REDIS_PASSWORD"

  # JWT Token Signing Key (Min 256-bit symmetric key)
  Auth__SigningKey: "REPLACE_WITH_AT_LEAST_256_BIT_KEY_0123456789abcdef0123456789abcdef"

  # Email Provider API Keys
  Email__ApiKey: "REPLACE_WITH_RESEND_OR_SENDGRID_KEY"
  Email__SmtpUsername: ""
  Email__SmtpPassword: ""

